# Odrzava Streamlit aplikaciju budnom: besplatni hosting zaspe posle 12h
# neaktivnosti, pa bi svako otvaranje cekalo 30-60s budjenja. Ovaj ping
# svakih 30 min sprecava spavanje - aplikacija se otvara odmah.
# Javni repozitorijum: GitHub Actions je besplatan (limit 2000 min/mesec,
# a ovo trosi ~700 min/mesec).
name: Odrzi aplikaciju budnom

on:
  schedule:
    - cron: '*/30 * * * *'  # svakih 30 minuta
  workflow_dispatch:          # dozvoljava rucno pokretanje (test)

permissions:
  contents: read

jobs:
  budi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probudi Streamlit aplikaciju
        run: |
          URL='https://vladislavveljkovic92-dot-centralni-magacin-streamlit-app-a82wgy.streamlit.app'
          echo "=== 1) curl na glavnu stranicu ==="
          curl -sS --max-time 45 -o /dev/null -w 'HTTP %{http_code}\n' "$URL/" || echo 'neuspeo zahtev'
          echo "=== 2) curl na health ==="
          curl -sS --max-time 45 -o /dev/null -w 'HTTP %{http_code}\n' "$URL/_stcore/health" || echo 'neuspeo zahtev'
          echo "=== 3) python (urllib) na health ==="
          python3 - <<'PYEOF'
          import urllib.request
          url = 'https://vladislavveljkovic92-dot-centralni-magacin-streamlit-app-a82wgy.streamlit.app/_stcore/health'
          req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140.0.0.0 Safari/537.36'})
          opener = urllib.request.build_opener(urllib.request.HTTPRedirectHandler)
          try:
              with opener.open(req, timeout=45) as r:
                  print(f'python: HTTP {r.status} | {r.read(60)!r}')
          except Exception as e:
              print(f'python: GRESKA {e}')
          PYEOF
          echo "=== 4) wget na health ==="
          wget -q --max-redirect=0 --timeout=45 -O /dev/null "$URL/_stcore/health" 2>&1 && echo 'wget: 200 OK' || echo "wget: exit=$? (303 ili greska)"
          echo "=== 5) node fetch na health ==="
          node -e "
          fetch('$URL/_stcore/health', {redirect:'manual', headers:{'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) Chrome/140.0.0.0'}})
            .then(r => console.log('node: HTTP ' + r.status + ' location=' + (r.headers.get('location')||'-').slice(0,60)))
            .catch(e => console.log('node: GRESKA ' + e.message));
          " || echo 'node nije dostupan'
          echo "=== Gotovo ==="
