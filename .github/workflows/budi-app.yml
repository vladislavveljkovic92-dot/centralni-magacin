# Odrzava Streamlit aplikaciju budnom: besplatni hosting zaspe posle 12h
# neaktivnosti, pa bi svako otvaranje cekalo 30-60s budjenja. Ovaj ping
# svakih 30 min sprecava spavanje - aplikacija se otvara odmah.
# Javni repozitorijum: GitHub Actions je besplatan (limit 2000 min/mesec,
# a ovo trosi ~700 min/mesec).
name: Odrzi aplikaciju budnom

on:
  schedule:
    - cron: '*/30 * * * *'  # svakih 30 minuta
  workflow_dispatch:          # dozvoljava rucno pokretanje (test)

permissions:
  contents: read

jobs:
  budi:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # pwsh (PowerShell Core) koristi .NET HTTP stek - Streamlit ga prihvata
      # za razliku od curl/python/wget/node koje blokira bot zastita (HTTP 303).
      - name: Probudi Streamlit aplikaciju (pwsh / .NET)
        shell: pwsh
        run: |
          $url = 'https://vladislavveljkovic92-dot-centralni-magacin-streamlit-app-a82wgy.streamlit.app'
          foreach ($putanja in @('/', '/_stcore/health')) {
              try {
                  $r = Invoke-WebRequest -Uri ($url + $putanja) -TimeoutSec 45 -MaximumRedirection 5
                  Write-Output ("{0} -> HTTP {1}" -f $putanja, $r.StatusCode)
              } catch {
                  Write-Output ("{0} -> GRESKA: {1}" -f $putanja, $_.Exception.Message)
              }
          }
          Write-Output 'Gotovo - aplikacija je budna.'
