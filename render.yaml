# Dedicated project account only. Review paid compute plans before applying.
databases:
  - name: magacin-central-db
    databaseName: magacin
    user: magacin
    plan: 0.1c-256mb
    region: frankfurt
    postgresMajorVersion: "17"
    ipAllowList: []

services:
  - type: web
    name: magacin-central-app
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    buildCommand: pip install -r requirements.lock.txt
    startCommand: python start_server.py
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.18
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: magacin-central-db
          property: connectionString
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false

